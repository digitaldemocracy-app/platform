# Local development only. Not used in production (see infra/README.md and ADR-0006).
# Default credentials below are for your own machine; production secrets never live in git.
name: digitaldemocracy-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitaldemocracy}
      POSTGRES_USER: ${POSTGRES_USER:-dd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dd-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dd} -d ${POSTGRES_DB:-digitaldemocracy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

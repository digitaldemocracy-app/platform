name: Technical proposal
description: A change to how the platform is built (not what it does — that goes to the docs repository).
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow, unsafe or unclear today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you suggest, with alternatives you considered. If it changes an architecture decision, say which ADR.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This does not weaken vote secrecy, verifiability, the ledger or "each person exists once".
          required: true
